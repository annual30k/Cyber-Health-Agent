[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyber-health-agent"
version = "0.2.9"
description = "Local-first, host-neutral health facts and MCP tools"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "pydantic>=2.11,<3", "PyYAML>=6,<7"]

[project.scripts]
cyber-health = "cyber_health.cli:main"
cyber-health-mcp = "cyber_health_mcp:main"
cyber-health-install = "cyber_health.install:main"
cyber-health-update = "cyber_health.update:main"
cyber-health-uninstall = "cyber_health.uninstall:main"

[tool.hatch.build.targets.wheel]
packages = ["cyber_health", "cyber_health_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"obsidian-memory-plugin/obsidian-memory-plugin-0.3.2.tgz" = "cyber_health/assets/obsidian-memory-plugin-0.3.2.tgz"
